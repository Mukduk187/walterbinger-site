<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Walter Binger</title>
    <meta
      name="description"
      content="Walter Binger."
    >
    <meta property="og:title" content="Walter Binger">
    <meta property="og:description" content="Walter Binger.">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%23fbf7ef'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23201f1b'/%3E%3Cpath d='M14 42c15-12 31-17 39-13' fill='none' stroke='%23cf1975' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css?v=20260719-spectral-beacons-20">
  </head>
  <body>
    <a class="skip-link" href="#constellation">Skip to constellation</a>

    <main class="page-shell" id="constellation">
      <h1 class="brand-script">Walter Binger</h1>

      <section class="lens-panel" aria-label="Choose a lens">
        <p>look by</p>
        <div class="lens-buttons" aria-label="Lens options">
          <button class="lens-button" type="button" aria-pressed="false" data-lens="argentina">Argentina</button>
          <button class="lens-button" type="button" aria-pressed="false" data-lens="collaboration">Collaboration</button>
          <button class="lens-button" type="button" aria-pressed="false" data-lens="travel">Travel</button>
          <button class="lens-button" type="button" aria-pressed="false" data-lens="food">Food</button>
          <button class="lens-button" type="button" aria-pressed="false" data-lens="nyc">NYC</button>
          <button class="lens-button" type="button" aria-pressed="false" data-lens="healthcare">Healthcare</button>
          <button class="lens-button" type="button" aria-pressed="false" data-lens="art">Art</button>
        </div>
      </section>

      <section class="stage" aria-label="Walter Binger">
        <svg class="star-map" viewBox="0 0 1200 760" role="img" aria-label="Walter Binger">
          <g class="paper-grain" aria-hidden="true"></g>
          <g class="constellation-shapes" data-constellations></g>
          <g class="constellation-lines" data-lines></g>
          <g class="magenta-layer" data-marker></g>
          <g class="star-layer" data-stars></g>
          <g class="flash-layer" data-flashes></g>
        </svg>
      </section>

      <div class="jump-tunnel" aria-hidden="true"></div>
      <div class="object-preview-layer" data-object-previews aria-hidden="true"></div>

      <aside class="discovery-note" aria-live="polite" hidden>
        <p data-note-title></p>
        <span data-note-copy></span>
        <div class="note-actions">
          <button class="note-button" type="button" data-go disabled>go</button>
          <button class="note-button" type="button" data-clear-pins hidden>clear</button>
        </div>
      </aside>

      <section class="artifact-dock" data-artifact-dock aria-live="polite">
        <article class="artifact-preview" data-artifact-preview hidden></article>
        <div class="artifact-carousel" data-carousel aria-label="Related artifacts"></div>
      </section>

      <section class="world-panel" data-world aria-hidden="true">
        <button class="world-back" type="button" data-back>sky</button>
        <article class="world-copy">
          <p data-world-kicker></p>
          <h2 data-world-title></h2>
          <p data-world-note></p>
        </article>
        <figure class="world-feature" data-world-feature hidden>
          <img data-world-image src="" alt="">
          <figcaption data-world-caption></figcaption>
        </figure>
        <div class="scene-graphic" data-scene-graphic aria-hidden="true"></div>
      </section>
    </main>

    <script src="script.js?v=20260719-spectral-beacons-20"></script>
  </body>
</html>
